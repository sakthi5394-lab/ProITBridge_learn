<!DOCTYPE html>
<html>
<head>
    <title>CIFAR10 Predictor</title>
    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">
</head>
<body>
<div class="container">
<h2>CIFAR10 Image Prediction</h2>

<form action="/predict"
      method="POST"
      enctype="multipart/form-data">

<input type="file"
       name="image"
       required>
<br><br>
<button type="submit">
Predict
</button>
</form>
{% if image %}
<hr>
<img src="{{ url_for('static',
filename='uploads/' + image) }}"
width="250">
<h3>Prediction : {{ prediction }}</h3>
<h4>Confidence : {{ confidence }}%</h4>
{% endif %}
</div>
</body>
</html>
